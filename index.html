<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match-3 Puzzle Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: white;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #f093fb, #f5576c, #fda085);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
  }
  #ui {
    display: flex;
    gap: 30px;
    margin-bottom: 15px;
    background: rgba(255,255,255,0.1);
    padding: 10px 25px;
    border-radius: 50px;
    backdrop-filter: blur(10px);
  }
  .stat { text-align: center; }
  .stat-label { font-size: 0.7rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }
  .stat-value { font-size: 1.4rem; font-weight: bold; }
  #score-val { color: #ffd700; }
  #moves-val { color: #00d4ff; }
  #target-val { color: #ff6b9d; }
  #canvas-wrapper {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  canvas {
    display: block;
    cursor: pointer;
    background: #0d1b2a;
  }
  #overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.8);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
  }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 2.5rem; margin-bottom: 10px; }
  #overlay p { opacity: 0.8; margin-bottom: 20px; }
  button {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    border: none;
    color: white;
    padding: 12px 30px;
    font-size: 1.1rem;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 5px 20px rgba(240,147,251,0.4);
  }
  button:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(240,147,251,0.6); }
  #hint { margin-top: 10px; font-size: 0.8rem; opacity: 0.5; }
</style>
</head>
<body>
<h1>💎 Match-3 Puzzle</h1>
<div id="ui">
  <div class="stat">
    <div class="stat-label">النقاط</div>
    <div class="stat-value" id="score-val">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">الهدف</div>
    <div class="stat-value" id="target-val">1000</div>
  </div>
  <div class="stat">
    <div class="stat-label">الحركات</div>
    <div class="stat-value" id="moves-val">30</div>
  </div>
</div>
<div id="canvas-wrapper">
  <canvas id="c"></canvas>
  <div id="overlay">
    <h2 id="overlay-title"></h2>
    <p id="overlay-msg"></p>
    <button onclick="restartGame()">العب مجدداً</button>
  </div>
</div>
<div id="hint">اضغط على جوهرة ثم على المجاورة لها لتبديلهما</div>

<script>
const COLS = 8, ROWS = 8;
const CELL = 64, PAD = 4;
const W = COLS * (CELL + PAD) + PAD;
const H = ROWS * (CELL + PAD) + PAD;
const TARGET = 1000;
const MAX_MOVES = 30;

const GEMS = [
  { color: '#ff4757', glow: '#ff6b81', emoji: '🔴' },
  { color: '#1e90ff', glow: '#70b8ff', emoji: '🔵' },
  { color: '#2ed573', glow: '#7bed9f', emoji: '🟢' },
  { color: '#ffd700', glow: '#ffe066', emoji: '🟡' },
  { color: '#a855f7', glow: '#d8a5ff', emoji: '🟣' },
  { color: '#ff7f50', glow: '#ffaa80', emoji: '🟠' },
];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

let board = [], score = 0, moves = MAX_MOVES, selected = null, processing = false;
let particles = [], floatingTexts = [];

function randType() { return Math.floor(Math.random() * GEMS.length); }

function safeRand(x, y) {
  let tries = 0, type;
  do {
    type = randType();
    tries++;
  } while (tries < 20 && wouldMatch(x, y, type));
  return type;
}

function wouldMatch(x, y, type) {
  if (x >= 2 && board[y][x-1]?.type === type && board[y][x-2]?.type === type) return true;
  if (y >= 2 && board[y-1]?.[x]?.type === type && board[y-2]?.[x]?.type === type) return true;
  return false;
}

function initBoard() {
  board = [];
  for (let y = 0; y < ROWS; y++) {
    board[y] = [];
    for (let x = 0; x < COLS; x++)
      board[y][x] = { type: safeRand(x, y), scale: 1, alpha: 1, oy: 0 };
  }
}

function cellPos(x, y) {
  return { cx: PAD + x * (CELL + PAD) + CELL/2, cy: PAD + y * (CELL + PAD) + CELL/2 };
}

function drawGem(x, y, gem, isSelected) {
  if (!gem) return;
  const { cx, cy } = cellPos(x, y);
  const s = gem.scale || 1;
  const g = GEMS[gem.type];
  ctx.save();
  ctx.globalAlpha = gem.alpha ?? 1;
  ctx.translate(cx, cy + (gem.oy || 0));
  ctx.scale(s, s);

  // Shadow / glow
  if (isSelected) {
    ctx.shadowColor = g.glow;
    ctx.shadowBlur = 20;
  }

  // Rounded rect
  const r = (CELL - 8) / 2;
  ctx.beginPath();
  roundRect(ctx, -r, -r, r*2, r*2, 14);
  const grad = ctx.createRadialGradient(-r*0.3, -r*0.3, 2, 0, 0, r*1.2);
  grad.addColorStop(0, lighten(g.color, 40));
  grad.addColorStop(1, g.color);
  ctx.fillStyle = grad;
  ctx.fill();

  if (isSelected) {
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // Shine
  ctx.beginPath();
  roundRect(ctx, -r*0.6, -r*0.7, r*0.9, r*0.4, 6);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fill();

  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function lighten(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Grid bg
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      const { cx, cy } = cellPos(x, y);
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      roundRect(ctx, cx - CELL/2 + 2, cy - CELL/2 + 2, CELL - 4, CELL - 4, 12);
      ctx.fill();
    }

  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      drawGem(x, y, board[y][x], selected && selected.x === x && selected.y === y);

  // Particles
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
  }

  // Floating score texts
  floatingTexts = floatingTexts.filter(t => t.life > 0);
  for (const t of floatingTexts) {
    ctx.save();
    ctx.globalAlpha = t.life / t.maxLife;
    ctx.fillStyle = '#ffd700';
    ctx.font = `bold ${t.size}px Segoe UI`;
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
    t.y -= 1.5; t.life--;
  }
}

function spawnParticles(x, y, type) {
  const { cx, cy } = cellPos(x, y);
  const color = GEMS[type].glow;
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.5;
    const speed = 2 + Math.random() * 3;
    particles.push({ x: cx, y: cy, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 2,
      r: 3 + Math.random()*3, color, life: 30, maxLife: 30 });
  }
}

function addFloatingText(x, y, text) {
  const { cx, cy } = cellPos(x, y);
  floatingTexts.push({ x: cx, y: cy, text, life: 40, maxLife: 40, size: 18 });
}

function findMatches() {
  const matched = new Set();
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS - 2; x++)
      if (board[y][x] && board[y][x+1] && board[y][x+2] &&
          board[y][x].type === board[y][x+1].type && board[y][x].type === board[y][x+2].type) {
        matched.add(`${x},${y}`); matched.add(`${x+1},${y}`); matched.add(`${x+2},${y}`);
        let nx = x+3;
        while (nx < COLS && board[y][nx]?.type === board[y][x].type) { matched.add(`${nx},${y}`); nx++; }
      }
  for (let x = 0; x < COLS; x++)
    for (let y = 0; y < ROWS - 2; y++)
      if (board[y][x] && board[y+1][x] && board[y+2][x] &&
          board[y][x].type === board[y+1][x].type && board[y][x].type === board[y+2][x].type) {
        matched.add(`${x},${y}`); matched.add(`${x},${y+1}`); matched.add(`${x},${y+2}`);
        let ny = y+3;
        while (ny < ROWS && board[ny]?.[x]?.type === board[y][x].type) { matched.add(`${x},${ny}`); ny++; }
      }
  return [...matched].map(k => { const [x,y] = k.split(',').map(Number); return {x,y}; });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function processMatches() {
  processing = true;
  while (true) {
    const matches = findMatches();
    if (!matches.length) break;

    const pts = matches.length * 50;
    score += pts;
    document.getElementById('score-val').textContent = score;

    // Animate out
    for (const {x,y} of matches) {
      spawnParticles(x, y, board[y][x].type);
      board[y][x].alpha = 0;
    }
    addFloatingText(matches[0].x, matches[0].y, `+${pts}`);
    await sleep(250);

    for (const {x,y} of matches) board[y][x] = null;

    // Gravity
    for (let x = 0; x < COLS; x++) {
      let empty = 0;
      for (let y = ROWS-1; y >= 0; y--) {
        if (!board[y][x]) empty++;
        else if (empty > 0) { board[y+empty][x] = board[y][x]; board[y][x] = null; }
      }
      for (let y = 0; y < empty; y++)
        board[y][x] = { type: randType(), scale: 1, alpha: 1, oy: -(CELL+PAD)*empty };
    }

    // Animate fall
    const start = performance.now();
    await new Promise(resolve => {
      function animFall(now) {
        const t = Math.min((now - start) / 300, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        let done = true;
        for (let y = 0; y < ROWS; y++)
          for (let x = 0; x < COLS; x++)
            if (board[y][x]?.oy) {
              board[y][x].oy = board[y][x].oy * (1 - ease);
              if (Math.abs(board[y][x].oy) < 0.5) board[y][x].oy = 0;
              else done = false;
            }
        if (!done) requestAnimationFrame(animFall);
        else resolve();
      }
      requestAnimationFrame(animFall);
    });
    await sleep(100);
  }

  if (score >= TARGET) { showOverlay('🎉 فزت!', `نقاطك: ${score}`); return; }
  if (moves <= 0) { showOverlay('💔 انتهت الحركات', `نقاطك: ${score}`); return; }
  processing = false;
}

async function trySwap(x1, y1, x2, y2) {
  if (processing) return;
  processing = true;

  // Animate swap
  const start = performance.now();
  const { cx: cx1, cy: cy1 } = cellPos(x1, y1);
  const { cx: cx2, cy: cy2 } = cellPos(x2, y2);
  const dx = cx2 - cx1, dy = cy2 - cy1;

  await new Promise(resolve => {
    function anim(now) {
      const t = Math.min((now - start) / 200, 1);
      const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      if (board[y1][x1]) board[y1][x1]._ox = dx * ease, board[y1][x1]._oy = dy * ease;
      if (board[y2][x2]) board[y2][x2]._ox = -dx * ease, board[y2][x2]._oy = -dy * ease;
      if (t < 1) requestAnimationFrame(anim);
      else resolve();
    }
    requestAnimationFrame(anim);
  });

  // Actually swap
  [board[y1][x1], board[y2][x2]] = [board[y2][x2], board[y1][x1]];
  if (board[y1][x1]) board[y1][x1]._ox = board[y1][x1]._oy = 0;
  if (board[y2][x2]) board[y2][x2]._ox = board[y2][x2]._oy = 0;

  const matches = findMatches();
  if (!matches.length) {
    // Swap back
    await sleep(100);
    [board[y1][x1], board[y2][x2]] = [board[y2][x2], board[y1][x1]];
    processing = false;
    return;
  }

  moves--;
  document.getElementById('moves-val').textContent = moves;
  if (moves <= 5) document.getElementById('moves-val').style.color = '#ff4757';

  await processMatches();
}

canvas.addEventListener('click', e => {
  if (processing) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const x = Math.floor(mx / (CELL + PAD)), y = Math.floor(my / (CELL + PAD));
  if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;

  if (!selected) { selected = {x, y}; return; }
  if (selected.x === x && selected.y === y) { selected = null; return; }

  const dx = Math.abs(x - selected.x), dy = Math.abs(y - selected.y);
  if (dx + dy === 1) {
    trySwap(selected.x, selected.y, x, y);
    selected = null;
  } else {
    selected = {x, y};
  }
});

function showOverlay(title, msg) {
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-msg').textContent = msg;
  document.getElementById('overlay').classList.add('show');
}

function restartGame() {
  score = 0; moves = MAX_MOVES; selected = null; processing = false;
  particles = []; floatingTexts = [];
  document.getElementById('score-val').textContent = 0;
  document.getElementById('moves-val').textContent = MAX_MOVES;
  document.getElementById('moves-val').style.color = '#00d4ff';
  document.getElementById('overlay').classList.remove('show');
  initBoard();
}

// Override drawGem to support _ox/_oy animation offsets
const _drawGem = drawGem;
function draw() {
  ctx.clearRect(0, 0, W, H);
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      const { cx, cy } = cellPos(x, y);
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.beginPath(); roundRect(ctx, cx-CELL/2+2, cy-CELL/2+2, CELL-4, CELL-4, 12); ctx.fill();
    }
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      const gem = board[y][x];
      if (!gem) continue;
      const isSel = selected && selected.x===x && selected.y===y;
      const { cx, cy } = cellPos(x, y);
      const ox = gem._ox || 0, oy2 = (gem._oy || 0) + (gem.oy || 0);
      const s = gem.scale || 1;
      const g = GEMS[gem.type];
      ctx.save();
      ctx.globalAlpha = gem.alpha ?? 1;
      ctx.translate(cx + ox, cy + oy2);
      ctx.scale(s, s);
      if (isSel) { ctx.shadowColor = g.glow; ctx.shadowBlur = 20; }
      const r = (CELL-8)/2;
      ctx.beginPath(); roundRect(ctx, -r, -r, r*2, r*2, 14);
      const grad = ctx.createRadialGradient(-r*.3,-r*.3,2,0,0,r*1.2);
      grad.addColorStop(0, lighten(g.color, 40)); grad.addColorStop(1, g.color);
      ctx.fillStyle = grad; ctx.fill();
      if (isSel) { ctx.strokeStyle='white'; ctx.lineWidth=3; ctx.stroke(); }
      ctx.beginPath(); roundRect(ctx,-r*.6,-r*.7,r*.9,r*.4,6);
      ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fill();
      ctx.restore();
    }
  particles = particles.filter(p=>p.life>0);
  for (const p of particles) {
    ctx.save(); ctx.globalAlpha=p.life/p.maxLife; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.restore();
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--;
  }
  floatingTexts = floatingTexts.filter(t=>t.life>0);
  for (const t of floatingTexts) {
    ctx.save(); ctx.globalAlpha=t.life/t.maxLife; ctx.fillStyle='#ffd700';
    ctx.font=`bold ${t.size}px Segoe UI`; ctx.textAlign='center';
    ctx.fillText(t.text,t.x,t.y); ctx.restore();
    t.y-=1.5; t.life--;
  }
}

function loop() { draw(); requestAnimationFrame(loop); }
initBoard();
loop();
</script>
</body>
</html>
